name: Daily SFTP to Snowflake ETL Pipeline

on:
  schedule:
    - cron: "0 6 * * *"
      timezone: "Asia/Kathmandu"

  workflow_dispatch:
    inputs:
      force_reload:
        description: "Force reload previously ingested files"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-sftp-snowflake-etl
  cancel-in-progress: false

jobs:
  ingest-sales-data:
    name: Run Batch SFTP Ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SFTP-to-Snowflake Batch Pipeline
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}

          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
          SFTP_FILE_PATTERN: ${{ secrets.SFTP_FILE_PATTERN }}
          SFTP_STRICT_HOST_KEY_CHECK: "true"
          SFTP_KNOWN_HOSTS_FILE: known_hosts

        run: |
          if [ "${{ inputs.force_reload }}" = "true" ]; then
            python 06_batch_pipeline.py --force
          else
            python 06_batch_pipeline.py
          fi
